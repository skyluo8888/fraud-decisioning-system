[project]
name = "fraud-decisioning-system"
version = "0.1.0"
description = "Real-time fraud decisioning system with feature store, model serving, and monitoring"
readme = "README.md"
authors = [
    { name = "skyluo8888", email = "skyluo1999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[project.scripts]
fraud-decisioning-system = "fraud_decisioning_system:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
